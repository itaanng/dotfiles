switch-to-workspace-right=['<Super>Page_Down', '<Super>KP_Next', '<Super><Alt>Right', '<Control><Alt>Right']
switch-to-workspace-up=['<Control><Alt>Up']
toggle-fullscreen=['<Control><Super>f']
toggle-maximized=['<Super>f']
unmaximize=['<Alt><Super>r']

[org/gnome/settings-daemon/plugins/media-keys]
control-center=['<Control><Super>s']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']
home=['<Super>h']
reboot=['<Shift><Alt><Super>Delete']
search=['<Super>s']
shutdown=['<Shift><Super>Delete']
www=['<Super>b']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>KP_Enter'
command='alacritty'
name='Open Terminal'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='Print'
command='fish -c "flameshot_focused"'
name='Take screenshot'

[org/gnome/shell/keybindings]
show-screen-recording-ui=['<Super>Print']
show-screenshot-ui=@as []
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
toggle-application-view=['<Super>space']
toggle-message-tray=['<Alt><Super>KP_Enter']
toggle-quick-settings=['<Control><Alt><Super>KP_Enter']